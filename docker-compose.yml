version: "3.9"

# Local/demo deployment of the full stack. Real production deployments would
# typically split these across managed services instead (see README's
# Deployment section) - this compose file is for running everything on one
# machine with a single `docker compose up`.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: luggo
      POSTGRES_PASSWORD: luggo
      POSTGRES_DB: luggo
    volumes:
      - luggo_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luggo"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      DATABASE_URL: postgresql://luggo:luggo@postgres:5432/luggo?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in a .env file, see server/.env.example}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in a .env file, see server/.env.example}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      QR_SECRET: ${QR_SECRET:?set QR_SECRET in a .env file, see server/.env.example}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?set RAZORPAY_KEY_ID in a .env file, see server/.env.example}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?set RAZORPAY_KEY_SECRET in a .env file, see server/.env.example}
      SERVICE_FEE_PERCENT: 10
    ports:
      - "4000:4000"

  client:
    build:
      context: ./client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  luggo_postgres_data:
