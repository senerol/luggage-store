server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend container (see docker-compose.yml) so
    # the frontend's relative `/api` base URL (src/api/client.ts) works
    # identically in Docker as it does behind Vite's dev proxy.
    location /api/ {
        proxy_pass http://server:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    # SPA fallback: any non-file, non-/api route serves index.html so
    # React Router can handle client-side routes like /storage/:id.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
